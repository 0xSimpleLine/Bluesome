name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-lastest, windows-latest, macos-latest]
    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@v4

    - name: Build
      working-directory: ./src-tauri
      run: cargo build --verbose
    
    - name: Test
      working-directory: ./src-tauri
      run: cargo test --verbose
